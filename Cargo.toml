[package]
name = "genegraph-storage"
version = "0.65.0"
edition = "2024"
description = "vector database: base Lance storage"
authors = ["Lorenzo <tunedconsulting@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/tuned-org-uk/genegraph-storage"
homepage = "https://github.com/tuned-org-uk/genegraph-storage"
documentation = "https://docs.rs/genegraph-storage"
readme = "README.md"
keywords = ["graph-storage", "vector-space", "similarity-search", "mlops", "aiops"]
categories = ["filesystem", "database", "asynchronous", "algorithms", "database-implementations"]
exclude = [
    "target/*",
    "Cargo.lock",
    ".git/*",
    ".github/*",
    "*.tmp",
    "docs/*",
    "benches/*",
    "examples/*"

]

[dependencies]
smartcore = "0.6.14"
ordered-float = "5.5.0"
rayon = "1.12.0"
sprs = "0.11.5"
log = "0.4.34"
env_logger = "0.11.11"
chrono = "0.4.45"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.151"}
arrow = { version = "^59.3.0" }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
futures = "0.3.34"
url = "2.5.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
parquet = { version = "^59.3.0" }
prost = "0.14.4"
prost-types = "0.14.4"
fastlanes = "0.7.2"
zarrs = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rand = "0.10.2"
rand_distr = "0.6.0"
approx = "0.5.1"
serde_json = "^1.0.151"
arrow = { version = "^59.3.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread" ] }
